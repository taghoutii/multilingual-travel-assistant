# Runtime settings. Secrets (API keys) are read from .env, never from this file.

seed: 42
log_level: INFO
max_sub_requests: 3
eval_reference_date: 2026-12-01

handlers:
  timeout_s: 5.0
  retries: 1

llm_client:
  timeout_s: 30.0
  max_retries: 2          # retries on 429, 5xx and timeouts; other 4xx never retried
  backoff_base_s: 1.0
  backoff_max_s: 20.0

# OpenAI-compatible endpoints. api_key_env names the variable in .env.
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY

# API models by role. `family` is used to check that the RAGAS judge differs from the generator.
# model: null = not chosen yet (confirmed with the user before pinning).
models:
  generation:
    provider: groq
    model: openai/gpt-oss-120b
    family: gpt-oss
    temperature: 0.2
  understanding_api:
    provider: groq
    model: openai/gpt-oss-120b
    family: gpt-oss
    temperature: 0.0
  ragas_judge:
    provider: gemini
    model: null   # Gemini Flash version confirmed in Phase 6
    family: gemini
    temperature: 0.0

understanding_base_model: null   # Qwen instruct ~1.5-2B, confirmed in Phase 3
embeddings_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

# Stage 1. Thresholds chosen on the synthetic data.
language_id:
  model: lid.176.ftz            # in models/, fetched by scripts/download_models.py
  unsupported_min_prob: 0.85    # top label outside fr/en/ar at or above this -> unsupported
  keep_previous_below: 0.5      # multi-turn: a weaker detection keeps the previous language

# Stage 2. One-Class SVM on embeddings of in-scope training queries.
scope_gate:
  model_file: scope_gate.joblib # in models/, written by scripts/train_scope_gate.py
  target_in_scope_accept: 0.97  # threshold = score quantile accepting this share of in-scope val
  nu_grid: [0.01, 0.02, 0.05, 0.1]
  gamma_grid: [scale, 2.0, 4.0, 8.0]   # capped at 8: above it scores saturate (template memorization)
